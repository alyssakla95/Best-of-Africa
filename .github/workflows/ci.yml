# Quality gate: typecheck + tests + build on every push and PR.
# The backend shipped with type errors for months and `npm test` ran zero
# tests without anyone noticing — this workflow is what makes that class of
# silent breakage impossible to merge.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # jsdom 30 and its locked undici runtime require Node APIs that are
          # unavailable on Node 20. Keep CI aligned with the production build
          # runtime so the React test pool can start reliably.
          node-version: '24'

      - name: Install backend dependencies
        run: npm ci

      # Root Vitest includes focused React component tests under frontend/src,
      # so frontend dependencies must exist before the combined suite starts.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend typecheck
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npx vitest run

      - name: Maintained Portuguese interface audit
        run: npm run audit:portuguese

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npx vite build
