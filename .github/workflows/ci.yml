# Quality gate: typecheck + tests + build on every push and PR.
# The backend shipped with type errors for months and `npm test` ran zero
# tests without anyone noticing — this workflow is what makes that class of
# silent breakage impossible to merge.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Backend typecheck
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npx vitest run

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Frontend build
        working-directory: frontend
        run: npx vite build
