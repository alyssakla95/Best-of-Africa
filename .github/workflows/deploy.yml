name: Deploy to Alyssa Cloudflare

on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Backend typecheck and tests
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Frontend typecheck and build
        working-directory: frontend
        env:
          VITE_API_URL: https://alyssa-boa-api.alyssavanklassen.workers.dev/api/v1
          VITE_SITE_URL: https://alyssa-boa-web.pages.dev
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

  deploy:
    name: Backend first, then Pages
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.alyssa.toml
      - name: Deploy backend Worker
        run: npx wrangler deploy --config wrangler.alyssa.toml
      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://alyssa-boa-api.alyssavanklassen.workers.dev/api/v1
          VITE_SITE_URL: https://alyssa-boa-web.pages.dev
        run: |
          npm install
          npm run build
      - name: Deploy Pages
        run: npx wrangler pages deploy frontend/dist --project-name alyssa-boa-web --branch main --commit-dirty=true
